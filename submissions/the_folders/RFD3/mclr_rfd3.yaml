# =====================================================================
# Configuration RFdiffusion3 — equipe the-folders — cible microcystine-LR
#
# ENTREE : ./mclr_lig_1fjm.pdb
#   Toxine extraite de 1FJM (chaine M, pose LIEE a la PP1, rayons X 2,1 A),
#   renommee en residu unique LIG. Les noms d'atomes sont IDENTIQUES a ceux
#   du fichier derive de 1LCM : les listes ci-dessous sont inchangees.
#
#   Pourquoi 1FJM et non 1LCM : c'est la structure de design actee par
#   l'equipe le 2026-11-17. Verification independante : la portee
#   phenyle->COO(D-Glu) vaut 13,5 A dans la pose 1FJM, soit au centre de la
#   plage visitee par l'ensemble RMN (10,7-14,8 A sur 27 conformeres de
#   1AY3), alors que la pose 1LCM donne 15,4 A, au bord superieur de cette
#   plage. 1LCM est une moyenne minimisee : sur un segment flexible, une
#   moyenne peut decrire une conformation que la molecule n'adopte pas.
#
#   O12 est le second oxygene du carboxylate du D-Glu. Il est absent des
#   structures deposees (1LCM comme 1FJM) et place par geometrie trigonale
#   sur C42 a 1,25 A. C'est une modification de la cible : elle est
#   documentee dans le RATIONALE.
#
# GROUPES D'ATOMES (noms LIG -> position chimique)
#   ADDA_DISTAL   = C30,C31,C22,O7,C21,C23,C24,C25,C26,C27,C28,C29
#                   C8 + methyle, C9, methoxy (O7 + C21), C10, phenyle
#   ADDA_DIENE    = C36,C35,C33,C34,C32        C4, C5, C6 + methyle, C7
#   ADDA_PROXIMAL = C40,C38,C39,C37            C1, C2 + methyle, C3
#   CARBOXY_GLU   = C42,O9,O12                 alpha-COO- du D-Glu6
#   CARBOXY_MASP  = C10,O3,O4                  alpha-COO- du D-MeAsp3
#   MDHA_ELECTROPHILE = C48                    AUCUNE cysteine a proximite
#
# A VERIFIER AVANT LE PREMIER LANCEMENT
#   `select_partially_buried` ne figure pas dans la documentation RF3 dont
#   nous disposons (qui ne liste que select_fixed_atoms, select_buried et
#   select_exposed). A confirmer sur le tutoriel officiel : si l'argument
#   n'existe pas, les trois configurations echoueront au lancement.
# =====================================================================

gutter_polar:            # d1 — gouttiere longue + un contact polaire
  input: ./mclr_lig_1fjm.pdb
  ligand: LIG
  length: 70-100
  select_fixed_atoms:
    LIG: ""              # rien de fige : RMSF du distal jusqu'a 7,6 A
  select_buried:
    LIG: "C30,C31,C22,O7,C21,C23,C24,C25,C26,C27,C28,C29,C36,C35,C33,C34,C32"
  select_partially_buried:
    LIG: "C40,C38,C39,C37"
  select_exposed:
    LIG: "N1,C1,C2,C3,O1,N2,C4,C5,O2,C6,C7,C8,C9,C11,N3,C12,C13,C14,O5,N4,C15,C16,O6,C17,C18,C19,N5,C20,N6,N7,N8,O8,N9,C41,C43,C44,C45,O10,N10,C46,C47,C48,C49,O11,C10,O3,O4"
  select_hbond_acceptor:
    LIG: "O9,O12,O7"     # carboxylate du D-Glu + methoxy

distal_pocket:           # d2 — segment distal enfoui, methoxy apparie
  input: ./mclr_lig_1fjm.pdb
  ligand: LIG
  length: 60-90
  select_fixed_atoms:
    LIG: ""
  select_buried:
    LIG: "C30,C31,C22,O7,C21,C23,C24,C25,C26,C27,C28,C29"
  select_partially_buried:
    LIG: "C36,C35,C33,C34,C32"
  select_exposed:
    LIG: "C40,C38,C39,C37,N1,C1,C2,C3,O1,N2,C4,C5,O2,C6,C7,C8,C9,C11,N3,C12,C13,C14,O5,N4,C15,C16,O6,C17,C18,C19,N5,C20,N6,N7,N8,O8,N9,C41,C43,C44,C45,O10,N10,C46,C47,C48,C49,O11,C42,O9,O12,C10,O3,O4"
  select_hbond_acceptor:
    LIG: "O7"

short_gutter_two_polar:  # d3 — proximal + diene enfouis, deux carboxylates contactes
  input: ./mclr_lig_1fjm.pdb
  ligand: LIG
  length: 70-100
  select_fixed_atoms:
    LIG: ""
  select_buried:
    LIG: "C40,C38,C39,C37,C36,C35,C33,C34,C32"
  select_partially_buried:
    LIG: "C30,C31,C22,O7,C21,C23,C24,C25,C26,C27,C28,C29"
  select_exposed:
    LIG: "N1,C1,C2,C3,O1,N2,C4,C5,O2,C6,C7,C8,C9,C11,N3,C12,C13,C14,O5,N4,C15,C16,O6,C17,C18,C19,N5,C20,N6,N7,N8,O8,N9,C41,C43,C44,C45,O10,N10,C46,C47,C48,C49,O11"
  select_hbond_acceptor:
    LIG: "O9,O12,O3,O4"
